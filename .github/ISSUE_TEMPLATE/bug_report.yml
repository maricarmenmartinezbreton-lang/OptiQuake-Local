name: Bug report
description: Report a reproducible defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and expected behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/FFmpeg version, camera/sensor model, FPS, and connection type.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and evidence
      description: Include commands, logs, placement, and test conditions. Do not upload private recordings without consent.
    validations:
      required: true