name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Allow GitHub Pages deployment time
        run: sleep 60
      - name: Notify IndexNow participating search engines
        run: python scripts/submit_indexnow.py
