name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Core self-test
        run: python src/optiquake.py --self-test
      - name: Plugin API test
        run: python tests/test_plugins.py
      - name: Detector test
        run: python tests/test_detector.py
      - name: Earthquake alerts test
        run: python tests/test_alerts.py
      - name: Validate JSON manifests
        shell: python
        run: |
          import json
          json.load(open("registry/plugins.json", encoding="utf-8"))
          json.load(open("schemas/plugin-manifest.schema.json", encoding="utf-8"))
      - name: Release integrity and secret guard
        run: python tests/test_release_integrity.py
