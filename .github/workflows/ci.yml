name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core self-test
        run: python src/optiquake.py --self-test
      - name: Plugin API test
        run: python tests/test_plugins.py
      - name: Validate JSON manifests
        shell: python
        run: |
          import json
          json.load(open("registry/plugins.json", encoding="utf-8"))
          json.load(open("schemas/plugin-manifest.schema.json", encoding="utf-8"))
